name: Sito installer

on:
  push:
    branches: [main]
    paths: ["site/**", "shell/**", "web-demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Demo web (WebAssembly)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          cd shell
          cargo build --lib --release --target wasm32-unknown-unknown --no-default-features --features web
          wasm-bindgen --target web --no-typescript --out-dir ../site/demo/pkg target/wasm32-unknown-unknown/release/cheip_shell.wasm
          cp ../web-demo/index.html ../site/demo/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
