name: Sito installer

on:
  push:
    branches: [main]
    paths: ["site/**", "shell/**", "web-demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # A new release puts its image chunks on the site
  workflow_run:
    workflows: ["Release Cheip OS"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Demo web (WebAssembly)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          cd shell
          cargo build --lib --release --target wasm32-unknown-unknown --no-default-features --features web
          wasm-bindgen --target web --no-typescript --out-dir ../site/demo/pkg target/wasm32-unknown-unknown/release/cheip_shell.wasm
          cp ../web-demo/index.html ../site/demo/index.html
      # The release run keeps a copy of its files as an artifact: use it even when
      # publishing the GitHub release failed, so a finished image always reaches the site
      - name: Files of the release run that just finished
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: /tmp/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Cheip OS image for the web installer (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/dist/dist-cheip-os-web.tar ]; then
            tar -C site -xf /tmp/dist/dist-cheip-os-web.tar --exclude=os/boot
            echo "Image from the release run artifact"; du -sh site/os
            exit 0
          fi
          # Newest release that actually has the web image (a failed build has none)
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" -q '[.[] | select(.assets | map(.name) | index("dist-cheip-os-web.tar"))][0].tag_name')
          if [ -n "$TAG" ] && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "dist-cheip-os-web.tar" --dir /tmp/web; then
            tar -C site -xf /tmp/web/dist-cheip-os-web.tar --exclude=os/boot
            echo "Image from $TAG"; du -sh site/os
          else
            echo "::warning::No web image in any release yet"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
