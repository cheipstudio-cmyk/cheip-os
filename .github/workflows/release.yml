name: Release Cheip OS

# Push di un tag vX.Y.Z (anche da Termux): pacchetti armv7, immagine per i Lumia
# MSM8x26, repository OTA firmato su Cloudflare R2, release GitHub.
# Oppure: push su main che cambia il file RELEASE (contiene la versione, es. 0.4.15)
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [RELEASE]

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DEVICE: qcom-msm8226
  CHANNEL: stable
  # Cartella pubblica su R2 servita da updates.cheipstudio.org
  OTA_PREFIX: cheip-os/stable
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  CHEIP_APK_KEY: ${{ secrets.CHEIP_APK_KEY }}

jobs:
  lk1st:
    # Bootloader caricato da BootShim al posto di resetphone.efi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lk1st msm8226
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-arm-none-eabi device-tree-compiler
          git clone --depth 1 https://github.com/Mainline4Lumia/lk2nd lk2nd
          cd lk2nd
          # SD write commands for the web installer + WinUSB descriptors for WebUSB
          git apply ../lk/cheip-sd.patch
          make TOOLCHAIN_PREFIX=arm-none-eabi- lk1st-msm8226 LK2ND_COMPATIBLE="microsoft,superman-lte" LK2ND_DTB_HINT="msm8926-microsoft-superman-lte" LK2ND_DISPLAY=cont-splash LK2ND_SIMPLEFB_DEFAULT="keep" LK2ND_RAMOOPS_DEFAULT="1" CHEIP_FASTBOOT_WINDOW=6000 MEMBASE=0x0FF00000 BASE_ADDR=0x10000000 SCRATCH_ADDR=0x20000000 SCRATCH_SIZE=0x18000000 -j"$(nproc)"
          mkdir -p ../boot && cp build-lk1st-msm8226/lk_s.elf ../boot/emmc_appsboot.mbn
          curl -fsSL -o ../boot/BootShim.efi https://github.com/imbushuo/boot-shim/releases/download/elf-loader-pre3/BootShim.efi
      - uses: actions/upload-artifact@v4
        with:
          name: boot
          path: boot/

  release:
    needs: lk1st
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boot
          path: boot/

      - name: Versione dal tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then REL="$GITHUB_REF_NAME"; else REL="v$(tr -d ' \n' < RELEASE)"; fi
          VER="${REL#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "REL=$REL" >> "$GITHUB_ENV"
          sed -i "0,/^version = .*/s//version = \"$VER\"/" shell/Cargo.toml
          sed -i "s/^pkgver=.*/pkgver=$VER/" packaging/*/APKBUILD
          test -f keys/cheip-os.rsa.pub || { echo "Manca keys/cheip-os.rsa.pub: lancia scripts/gen-key.sh"; exit 1; }

      - name: Commit locale della versione (serve a git archive)
        run: |
          (cd shell && cargo metadata --format-version 1 > /dev/null)
          git -c user.name=ci -c user.email=ci@cheipstudio.org commit -qam "release $VER"

      - name: Installa pmbootstrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git openssl python3 kpartx
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -s "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo modprobe loop || true

      - name: Configura pmbootstrap
        run: |
          yes "" | pmbootstrap init || true
          pmbootstrap config device "$DEVICE"
          pmbootstrap config user cheip
          pmbootstrap config hostname cheip-os
          pmbootstrap config timezone Europe/Rome
          pmbootstrap config locale it_IT.UTF-8
          WORK="$(pmbootstrap config work)"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "APORTS=$(pmbootstrap config aports)" >> "$GITHUB_ENV"

      - name: Chiave di firma OTA
        # pmbootstrap firma pacchetti e indice con la chiave in config_abuild:
        # mettendoci la nostra, il repository è subito verificabile dai telefoni.
        run: |
          mkdir -p "$WORK/config_abuild" "$WORK/config_apk_keys"
          if [ -z "$CHEIP_APK_KEY" ]; then
            # Senza il segreto: chiave usa e getta, va bene per le build di prova
            echo "::warning::CHEIP_APK_KEY mancante: build di prova con chiave temporanea"
            openssl genrsa -out /tmp/tmp.rsa 2048
            openssl rsa -in /tmp/tmp.rsa -pubout -out keys/cheip-os.rsa.pub
            CHEIP_APK_KEY="$(cat /tmp/tmp.rsa)"
          fi
          printf '%s\n' "$CHEIP_APK_KEY" > "$WORK/config_abuild/cheip-os.rsa"
          cp keys/cheip-os.rsa.pub "$WORK/config_abuild/cheip-os.rsa.pub"
          cp keys/cheip-os.rsa.pub "$WORK/config_apk_keys/cheip-os.rsa.pub"
          echo 'PACKAGER_PRIVKEY="/home/pmos/.abuild/cheip-os.rsa"' > "$WORK/config_abuild/abuild.conf"
          chmod 600 "$WORK/config_abuild/cheip-os.rsa"
          # Readable by the pmos user (uid 12345) inside the build chroot
          sudo chown -R 12345:12345 "$WORK/config_abuild"

      - name: Pacchetti Cheip nei pmaports
        run: |
          mkdir -p "$APORTS/cheip"
          cp -r packaging/cheip-shell packaging/postmarketos-ui-cheip "$APORTS/cheip/"
          git archive --format=tar.gz --prefix="cheip-os-$VER/" -o "$APORTS/cheip/cheip-shell/cheip-os-$VER.tar.gz" HEAD
          cp keys/cheip-os.rsa.pub "$APORTS/cheip/postmarketos-ui-cheip/"
          pmbootstrap checksum cheip-shell postmarketos-ui-cheip
          pmbootstrap config ui cheip

      - name: Kernel with the Lumia SMP patch (all four cores)
        # If it fails the image still builds with the stock kernel (one core)
        continue-on-error: true
        run: |
          KAPK="$(find "$APORTS/device" -path '*/linux-postmarketos-qcom-msm8226/APKBUILD' | head -1)"
          test -n "$KAPK"
          KDIR="$(dirname "$KAPK")"
          # No patch context to match: copy the file and add it to the Makefile in prepare()
          cp kernel/files/parking.c "$KDIR/"
          python3 - "$KAPK" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s = re.sub(r'^source="', 'source="\n\tparking.c\n\t', s, count=1, flags=re.M)
          s = re.sub(r'^pkgrel=(\d+)', lambda m: 'pkgrel=%d' % (int(m.group(1)) + 100), s, count=1, flags=re.M)
          hook = '\tcp "$srcdir"/parking.c "$builddir"/arch/arm/mach-qcom/parking.c\n\tgrep -q parking.o "$builddir"/arch/arm/mach-qcom/Makefile || echo \'obj-$(CONFIG_SMP) += parking.o\' >> "$builddir"/arch/arm/mach-qcom/Makefile\n'
          s, n = re.subn(r'(^\s*default_prepare\s*\n)', lambda m: m.group(1) + hook, s, count=1, flags=re.M)
          if n == 0:
              raise SystemExit("no default_prepare in the kernel APKBUILD")
          open(p, 'w').write(s)
          PY
          sed -n '1,/^}/p' "$KAPK" | grep -n "parking\|pkgrel\|default_prepare\|builddir" | head -20
          pmbootstrap checksum linux-postmarketos-qcom-msm8226
          if ! pmbootstrap build --arch armv7 linux-postmarketos-qcom-msm8226; then
            tail -n 300 "$WORK/log.txt" > kernel-log.txt
            # Back to the stock kernel package, or pmbootstrap install would try to rebuild it
            git -C "$KDIR" checkout -- . && rm -f "$KDIR"/parking.c
            exit 3
          fi

      - name: Build armv7
        run: pmbootstrap build --arch armv7 cheip-shell postmarketos-ui-cheip

      - name: Immagine
        run: |
          set -x
          pmbootstrap -y install --zap --password 147147
          mkdir -p out
          pmbootstrap export out
          # lk1st has no bundled device DTB: explicit fdt line, boot log on screen
          sudo apt-get install -y -qq e2fsprogs fdisk device-tree-compiler
          for f in out/*.img; do case "$f" in *boot.img*) continue;; esac
            sudo sh scripts/fix-extlinux.sh "$(readlink -f "$f")" qcom-msm8926-microsoft-superman-lte.dtb; done
          for f in out/*.img; do xz -T0 -6 -c "$(readlink -f "$f")" > "dist-$(basename "$f").xz"; done
          # boot.img per l'avvio da RAM con "fastboot boot" da lk1st
          for f in out/boot.img*; do [ -e "$f" ] && cp "$(readlink -f "$f")" "dist-$(basename "$f")"; done
          # Chunks for the web installer (served by GitHub Pages, same origin)
          IMG="$(ls out/*.img | grep -v boot.img | head -1)"
          python3 scripts/mkchunks.py "$(readlink -f "$IMG")" web/os "$VER"
          mkdir -p web/os/boot && cp boot/BootShim.efi boot/emmc_appsboot.mbn web/os/boot/
          tar -C web -cf dist-cheip-os-web.tar os
          ls -la dist-* || true

      - name: Repository OTA
        # Not blocking: the image and the web installer go out anyway
        continue-on-error: true
        run: |
          mkdir -p ota/armv7
          PKGDIR="$(ls -d "$WORK"/packages/*/armv7 | head -1)"
          cp "$PKGDIR"/cheip-shell-*.apk "$PKGDIR"/postmarketos-ui-cheip-*.apk ota/armv7/
          # Indice firmato con la nostra chiave, dentro il chroot di pmbootstrap
          sudo cp -r ota/armv7 "$WORK/chroot_native/tmp/ota"
          pmbootstrap chroot --add=abuild,apk-tools -- sh -c 'cd /tmp/ota && apk index --allow-untrusted -o APKINDEX.tar.gz *.apk && abuild-sign -k /home/pmos/.abuild/cheip-os.rsa APKINDEX.tar.gz'
          sudo cp "$WORK/chroot_native/tmp/ota/APKINDEX.tar.gz" ota/armv7/
          sudo chown -R "$USER" ota
          NOTES="$(git tag -l --format='%(contents:subject)' "$REL")"
          python3 - "$VER" "$NOTES" > ota/manifest.json <<'PY'
          import json, sys
          print(json.dumps({
              "version": sys.argv[1],
              "notes": sys.argv[2],
              "devices": ["microsoft,superman-lte", "microsoft,dempsey", "microsoft,makepeace",
                          "microsoft,moneypenny", "microsoft,tesla"],
          }, indent=2))
          PY
          cat ota/manifest.json

      - name: Upload su Cloudflare R2
        if: env.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          EP="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          # Prima i pacchetti, l'indice e il manifest per ultimi: nessun telefono vede un repo a metà
          aws s3 cp ota/armv7/ "s3://$R2_BUCKET/$OTA_PREFIX/armv7/" --recursive --exclude APKINDEX.tar.gz --endpoint-url "$EP"
          aws s3 cp ota/armv7/APKINDEX.tar.gz "s3://$R2_BUCKET/$OTA_PREFIX/armv7/APKINDEX.tar.gz" --endpoint-url "$EP"
          aws s3 cp ota/manifest.json "s3://$R2_BUCKET/$OTA_PREFIX/manifest.json" --endpoint-url "$EP" --cache-control "no-cache"

      - name: Copia di sicurezza dei file (se la release fallisce)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist-*
          retention-days: 7

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL }}
          name: ${{ env.REL }}
          target_commitish: ${{ github.sha }}
          files: |
            dist-*
            boot/BootShim.efi
            boot/emmc_appsboot.mbn
            ota/armv7/*.apk
            ota/manifest.json
            kernel-log.txt

      - name: Log pmbootstrap in caso di errore
        if: failure()
        run: |
          tail -n 400 "$WORK/log.txt" > ci-log.txt 2>&1 || true
          cat ci-log.txt | tail -n 200

      # Public copy of the failure log (job logs need a GitHub login to read)
      - name: Pubblica il log dell'errore
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: CI logs
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            ci-log.txt
            kernel-log.txt
