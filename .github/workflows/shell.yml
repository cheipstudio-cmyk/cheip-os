name: Shell (test e screenshot)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GStreamer, FFmpeg e MuPDF per i test media
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-libav ffmpeg mupdf-tools libfontconfig1-dev libxkbcommon-dev libudev-dev libinput-dev libgbm-dev libdrm-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - name: Test
        working-directory: shell
        run: cargo test --no-default-features --features screens --lib
      - name: Screenshot 720x1280
        working-directory: shell
        run: cargo run --release --no-default-features --features screens --bin cheip-screens -- ../screens
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/*.png
