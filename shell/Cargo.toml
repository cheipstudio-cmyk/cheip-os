[package]
name = "cheip-shell"
version = "0.3.0"
edition = "2021"
description = "Shell di Cheip OS per i Lumia MSM8x26"
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "cheip_shell"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cheip-shell"
path = "src/main.rs"

[[bin]]
name = "cheip-screens"
path = "src/bin/screens.rs"
required-features = ["screens"]

[features]
default = ["desktop"]
# Sviluppo su PC: finestra 360x640
desktop = ["native", "slint/backend-winit", "slint/renderer-femtovg", "slint/renderer-software", "slint/software-renderer-path"]
# Telefono: DRM/KMS diretto, niente compositor. GLES con freedreno, software su simpledrm
device = [
    "native",
    "slint/backend-linuxkms",
    "slint/backend-linuxkms-libinput",
    "slint/backend-linuxkms-noseat",
    "slint/renderer-femtovg",
    "slint/renderer-software",
    "slint/software-renderer-path",
]
# Tutto ciò che parla col sistema: GStreamer, rete, tag audio
native = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:lofty", "dep:ureq", "dep:libc"]
# Demo interattiva nel browser (WebAssembly), con file e media finti incorporati
web = ["slint/backend-winit", "slint/renderer-femtovg", "dep:wasm-bindgen", "dep:web-sys", "chrono/wasmbind"]
# Screenshot headless delle schermate
screens = ["native", "dep:i-slint-core", "slint/renderer-software", "slint/software-renderer-path", "slint/software-renderer-systemfonts"]

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "image-default-formats"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"], optional = true }
scraper = { version = "0.20", default-features = false }
url = "2"
percent-encoding = "2"
# Solo per gli screenshot headless: il backend del telefono abilita già i decoder
i-slint-core = { version = "=1.19.1", features = ["image-decoders"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
lofty = { version = "0.25", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Navigator", "AudioContext", "BaseAudioContext", "AudioNode", "AudioParam", "AudioDestinationNode", "OscillatorNode", "OscillatorType", "GainNode", "AudioScheduledSourceNode"] }
libc = { version = "0.2", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
once_cell = "1"
material-colors = { version = "0.5.0", features = ["quantize"] }

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
