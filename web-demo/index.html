<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Cheip OS</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #canvas {
    position: fixed; left: 0; top: 0;
    width: 100vw !important; height: 100vh !important;
    display: block; outline: none; touch-action: none;
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #000; color: #9a9a9a; font: 14px system-ui, sans-serif; transition: opacity .4s ease;
  }
  #boot b { color: #fff; font-size: 30px; letter-spacing: -0.5px; }
  #bar { width: 140px; height: 3px; border-radius: 2px; background: #1a1a1a; overflow: hidden; }
  #bar i { display: block; width: 40%; height: 100%; background: #c6ff3d; animation: run 1.1s infinite ease-in-out; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  #hint { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center; color: #5f5f5f; font: 12px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="boot">
  <b>Cheip OS</b>
  <div id="bar"><i></i></div>
  <span id="msg">Loading</span>
  <div id="hint">Swipe up to unlock. Pull down from the top for quick settings.<br>Swipe up from the bottom bar: short for home, long for recent apps.</div>
</div>
<script type="module">
  import init from "./pkg/cheip_shell.js";
  const boot = document.getElementById("boot");
  const hide = () => { boot.style.opacity = "0"; setTimeout(() => boot.remove(), 450); };
  // Schermo intero al primo tocco, dove il browser lo permette
  const full = () => {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
    window.removeEventListener("pointerdown", full);
  };
  window.addEventListener("pointerdown", full);
  // Niente menu del tasto destro e niente zoom col doppio tocco
  window.addEventListener("contextmenu", e => e.preventDefault());
  window.addEventListener("gesturestart", e => e.preventDefault());
  setTimeout(hide, 6000);
  init().then(hide).catch(e => {
    // winit usa un'eccezione per avviare il ciclo eventi: non è un errore vero
    if (String(e).includes("Using exceptions for control flow")) { hide(); return; }
    document.getElementById("msg").textContent = "Could not start: " + e;
    console.error(e);
  });
</script>
</body>
</html>
